name: VeyCut Web

on:
  push:
    branches: [main, development/0.3.0, development/web-editor-parity]
    paths: ['web/**', 'src/crates/veycut-web/**', 'src/crates/concat-project/**', 'src/crates/concat-core/**', 'src/Cargo.lock', '.github/workflows/veycut-web.yml', 'scripts/veycut_web_browser_check.js', 'scripts/test_web_compositor.js', 'scripts/veycut_web_parity_check.js', 'scripts/verify_web_parity.py', 'scripts/veycut_web_legacy_check.js']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: veycut-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Shared engine and Chromium editing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: veycut-browser
          cache-on-failure: 'true'
          cache-workspace-crates: 'true'
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.127-linux-x64
      - name: Check portable bridge
        working-directory: src
        run: |
          cargo fmt -p veycut-web --check
          cargo clippy -p veycut-web --all-targets --locked -- -D warnings
          cargo test -p veycut-web --locked
          cargo clippy -p veycut-web --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build static browser package
        working-directory: src
        run: |
          cargo build -p veycut-web --release --target wasm32-unknown-unknown --locked
          if ! command -v wasm-bindgen > /dev/null; then
            cargo install wasm-bindgen-cli --version 0.2.127 --locked
          fi
          test "$(wasm-bindgen --version)" = 'wasm-bindgen 0.2.127'
          wasm-bindgen target/wasm32-unknown-unknown/release/veycut_web.wasm --target web --out-dir ../web/pkg
      - name: Bundle licensed Persian font
        run: |
          mkdir -p web/fonts
          cp src/crates/concat-text/fonts/Vazirmatn-Variable.ttf web/fonts/
          cp src/crates/concat-text/fonts/LICENSE-Vazirmatn.txt web/fonts/
          cp LICENSE SOURCE-NOTICES.md LICENSE-EXCEPTIONS.md web/
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install server-only browser tools
        run: |
          npm install --global @playwright/cli@0.1.22
          node "$(npm root -g)/@playwright/cli/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install --yes ffmpeg
          node --check web/app.js
          node --check web/export.js
          node --check web/compositor.js
          node --check web/preview.js
          node scripts/test_web_compositor.js
          node --check scripts/veycut_web_browser_check.js
          node --check scripts/veycut_web_parity_check.js
          node --check scripts/veycut_web_legacy_check.js
      - name: Run browser editing workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/playwright
          python3 - <<'PY'
          from pathlib import Path
          folder = Path('output/playwright')
          (folder / 'captions.srt').write_text('1\n00:00:00,000 --> 00:00:00,800\nسلام جهان\n\n2\n00:00:00,800 --> 00:00:01,600\nEnglish caption\n')
          (folder / 'invalid.json').write_text('{"format":"unrelated"}')
          PY
          python3 -m http.server 4173 --bind 127.0.0.1 --directory web > output/playwright/server.log 2>&1 &
          server_pid=$!
          cleanup_browser() {
            result=$?
            if [ "$result" -ne 0 ]; then
              for log in output/playwright/edit.log output/playwright/check.log output/playwright/limit-check.log output/playwright/parity*.log output/playwright/legacy*.log; do
                if [ -f "$log" ]; then tail -c 18000 "$log"; fi
              done
              timeout 20s playwright-cli snapshot --filename=output/playwright/failure-snapshot.yml > output/playwright/failure-snapshot.log 2>&1 || true
              timeout 20s playwright-cli console > output/playwright/failure-console.log 2>&1 || true
            fi
            kill "$server_pid" || true
            playwright-cli close || true
            exit "$result"
          }
          trap cleanup_browser EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          playwright-cli open http://127.0.0.1:4173/ --browser=chromium > output/playwright/open.log
          playwright-cli snapshot --filename=output/playwright/initial.yml
          playwright-cli run-code --filename=scripts/veycut_web_browser_check.js > output/playwright/edit.log
          python3 - <<'PY'
          import copy, json
          from pathlib import Path
          folder = Path('output/playwright')
          project = json.loads((folder / 'project.json').read_text())
          native = project['engineDocument']
          legacy = {'format': 'veycut-web', 'schema': 1, 'engine': 'javascript',
              'media': [{key: value for key, value in item.items() if key != 'kind'} for item in project['media']],
              'clips': [{key: clip[key] for key in ['id', 'mediaId', 'in', 'out', 'timelineStart']} for clip in project['clips'] if clip['kind'] == 'video'],
              'cues': [{key: cue[key] for key in ['id', 'start', 'end', 'text']} for cue in project['cues']]}
          (folder / 'legacy-project.json').write_text(json.dumps(legacy))
          broken = copy.deepcopy(legacy)
          broken['clips'][0]['timelineStart'] = 'invalid'
          (folder / 'legacy-invalid.json').write_text(json.dumps(broken))
          ui_source = next(clip for clip in project['clips'] if clip['kind'] == 'video')
          native_source = next(clip for clip in native['clips'] if clip['id'] == ui_source['id'])
          duration = ui_source['out'] - ui_source['in']
          assert abs(duration - .8) < .002
          project['clips'], native['clips'] = [], []
          project['cues'], project['cueIds'] = [], []
          for index in range(151):
              identifier, position = 'browser-limit-' + str(index), .2 + index * duration
              ui_clip, native_clip = copy.deepcopy(ui_source), copy.deepcopy(native_source)
              ui_clip.update(id=identifier, timelineStart=position, start=position)
              native_clip.update(id=identifier, start=position)
              project['clips'].append(ui_clip)
              native['clips'].append(native_clip)
          active = [timeline for timeline in native['timelines'] if timeline['id'] == native['activeTimelineId']]
          assert len(active) == 1
          active[0]['clips'] = copy.deepcopy(native['clips'])
          assert abs(native['clips'][-1]['start'] + duration - 121) < .002
          (folder / 'limit-project.json').write_text(json.dumps(project))
          PY
          playwright-cli snapshot --filename=output/playwright/reconnect.yml
          reconnect_ref=$(python3 - <<'PY'
          import re
          from pathlib import Path
          snapshot = Path('output/playwright/reconnect.yml').read_text()
          refs = re.findall(r'button "Reconnect selected media" \[ref=(e\d+)\]', snapshot)
          assert len(refs) == 1, snapshot
          print(refs[0])
          PY
          )
          playwright-cli click "$reconnect_ref"
          playwright-cli upload docs/beta-samples/portrait-2s.mp4
          playwright-cli run-code --filename=scripts/veycut_web_browser_check.js > output/playwright/check.log
          playwright-cli snapshot --filename=output/playwright/limit-reconnect.yml
          limit_ref=$(python3 - <<'PY'
          import re
          from pathlib import Path
          refs = re.findall(r'button "Reconnect selected media" \[ref=(e\d+)\]', Path('output/playwright/limit-reconnect.yml').read_text())
          assert len(refs) == 1, refs
          print(refs[0])
          PY
          )
          playwright-cli click "$limit_ref"
          playwright-cli upload docs/beta-samples/portrait-2s.mp4
          playwright-cli run-code --filename=scripts/veycut_web_browser_check.js > output/playwright/limit-check.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          report = json.loads(Path('output/playwright/browser-report.json').read_text())
          assert report['status'] == 'passed' and report['engine'] == 'wasm'
          assert report['clips'] == 4 and report['videoClips'] == 2 and report['textClips'] == 2
          assert report['captions'] == 2 and report['language'] == 'fa'
          assert len(report['checks']) == 16
          assert report['export']['precision'] == 'realtime'
          assert report['durationLimit'] == {'timelineSeconds': 121, 'limitSeconds': 120, 'downloaded': False}
          project = json.loads(Path('output/playwright/project.json').read_text())
          assert len(project['clips']) == 4
          assert project['engine'] == 'wasm'
          native = project['engineDocument']['clips']
          assert len(native) == 4
          videos = sorted([clip for clip in native if clip['kind'] == 'video'], key=lambda clip: clip['start'])
          titles = [clip for clip in native if clip['kind'] == 'text']
          assert len(videos) == len(titles) == 2
          assert abs(videos[0]['sourceStart'] - .2) < .002
          assert abs(videos[1]['sourceStart'] - 1) < .002
          assert all(abs(clip['duration'] - .8) < .002 for clip in videos)
          assert set(project['cueIds']) == {clip['id'] for clip in titles}
          for cue in project['cues']:
              title = next(clip for clip in titles if clip['id'] == cue['nativeId'])
              assert title['text']['content'] == cue['text']
              assert abs(title['start'] - cue['start']) < .002
              assert abs(title['duration'] - (cue['end'] - cue['start'])) < .002
          assert 'blob:' not in json.dumps(project)
          for name in ['cancel-after.json', 'export-after.json']:
              assert json.loads(Path('output/playwright', name).read_text()) == project, name + ' changed saved edits'
          assert 'Web check سلام' in Path('output/playwright/subtitles.srt').read_text()
          PY
          python3 - <<'PY'
          import array, json, math, subprocess
          from pathlib import Path
          folder = Path('output/playwright')
          output = folder / 'browser-video.webm'
          assert 0 < output.stat().st_size <= 256 * 1024 * 1024
          def run(arguments, **kwargs):
              return subprocess.run(arguments, check=True, timeout=90, stdout=subprocess.PIPE, stderr=subprocess.PIPE, **kwargs).stdout
          probe = json.loads(run(['ffprobe', '-v', 'error', '-show_streams', '-show_format', '-of', 'json', str(output)]))
          (folder / 'webm-probe.json').write_text(json.dumps(probe, indent=2))
          videos = [s for s in probe['streams'] if s['codec_type'] == 'video']
          audios = [s for s in probe['streams'] if s['codec_type'] == 'audio']
          assert len(videos) == len(audios) == 1, probe
          assert (videos[0]['width'], videos[0]['height']) == (360, 640)
          assert videos[0]['codec_name'] in ['vp8', 'vp9'] and audios[0]['codec_name'] == 'opus'
          assert 'webm' in probe['format']['format_name']
          run(['ffmpeg', '-v', 'error', '-xerror', '-i', str(output), '-map', '0:v:0', '-map', '0:a:0', '-f', 'null', '-'])
          frames = json.loads(run(['ffprobe', '-v', 'error', '-show_frames', '-show_entries', 'frame=media_type,best_effort_timestamp_time,pkt_duration_time', '-of', 'json', str(output)]))['frames']
          decoded = {}
          for kind, fallback in [('video', 1 / 30), ('audio', 960 / 48000)]:
              selected = [f for f in frames if f['media_type'] == kind]
              assert selected and all('best_effort_timestamp_time' in f for f in selected)
              pts = [float(f['best_effort_timestamp_time']) for f in selected]
              assert pts == sorted(pts), kind + ' timestamps out of order'
              end = max(float(f['best_effort_timestamp_time']) + float(f.get('pkt_duration_time', fallback)) for f in selected)
              assert 1.45 <= end <= 2.15, (kind, end)
              decoded[kind] = {'frames': len(selected), 'ptsEndSeconds': end, 'lastFramePtsSeconds': max(pts)}
          assert decoded['video']['frames'] >= 30
          pcm = array.array('h')
          pcm.frombytes(run(['ffmpeg', '-v', 'error', '-i', str(output), '-vn', '-ac', '1', '-ar', '8000', '-f', 's16le', '-']))
          assert len(pcm) >= 10000
          rms = math.sqrt(sum((sample / 32768) ** 2 for sample in pcm) / len(pcm))
          assert rms > .001, 'Source tone missing from decoded audio'
          def window_rms(start, end):
              samples = pcm[round(start * 8000):round(end * 8000)]
              assert len(samples) >= 1600, ('Decoded audio too short for timing window', start, end)
              return math.sqrt(sum((sample / 32768) ** 2 for sample in samples) / len(samples))
          # The fixture is silent before source1s, then contains a tone.
          # Leading0.2s plus source0.2-1.0 keeps the intended global onset1.0s.
          silence_rms, tone_rms = window_rms(.25, .65), window_rms(1.2, 1.5)
          assert silence_rms < .001, ('Tone arrived early', silence_rms)
          assert tone_rms > .001 and tone_rms > silence_rms * 5, ('Tone absent after intended onset', tone_rms, silence_rms)
          def caption_frame(at, name):
              run(['ffmpeg', '-v', 'error', '-ss', str(at), '-i', str(output), '-frames:v', '1', '-y', str(folder / name)])
              rgb = run(['ffmpeg', '-v', 'error', '-i', str(folder / name), '-frames:v', '1', '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-'])
              assert len(rgb) == 360 * 640 * 3
              return sum(min(rgb[(y * 360 + x) * 3:(y * 360 + x) * 3 + 3]) >= 180
                         for y in range(int(640 * .82), int(640 * .94)) for x in range(18, 342))
          caption_pixels = caption_frame(.4, 'export-caption-frame.png')
          blank_at = max(.8, decoded['video']['lastFramePtsSeconds'] - .003)
          blank_pixels = caption_frame(blank_at, 'export-caption-ended-frame.png')
          assert caption_pixels > 100 and blank_pixels < max(40, caption_pixels * .05), (caption_pixels, blank_pixels)
          evidence = {'status': 'passed', 'fullDecode': True, 'dimensions': [360, 640],
              'expectedTimelineSeconds': 1.8, 'allowedPtsEndSeconds': [1.45, 2.15],
              'decoded': decoded, 'audioRms': rms,
              'audioTiming': {'expectedToneOnsetSeconds': 1.0,
                  'silenceWindowSeconds': [.25, .65], 'silenceRms': silence_rms,
                  'toneWindowSeconds': [1.2, 1.5], 'toneRms': tone_rms,
                  'precision': 'Bounded separated windows, not sample-accurate synchronization.'},
              'captionRegionBrightPixels': caption_pixels,
              'endedCaptionRegionBrightPixels': blank_pixels, 'endedCaptionFrameSeconds': blank_at,
              'limits': 'Duration rejection and offered dimensions tested; size cap enforced on output, not stress-tested.',
              'precision': 'Real-time browser output; this synthetic short fixture does not prove frame-accurate timing or real user footage.'}
          (folder / 'webm-decoder-report.json').write_text(json.dumps(evidence, indent=2))
          PY
          ffmpeg -v error -f lavfi -i color=c=red:s=256x256 -frames:v 1 -threads 1 -y output/playwright/layer.png
          ffmpeg -v error -f lavfi -i sine=frequency=880:duration=2:sample_rate=48000 -c:a pcm_s16le -y output/playwright/tone.wav
          playwright-cli run-code --filename=scripts/veycut_web_parity_check.js > output/playwright/parity-check.log
          for kind in video image audio; do
            playwright-cli snapshot --filename=output/playwright/parity-reconnect.yml
            parity_ref=$(python3 - <<'PYREF'
          import re
          from pathlib import Path
          refs = re.findall(r'button "Reconnect selected media" \[ref=(e\d+)\]', Path('output/playwright/parity-reconnect.yml').read_text())
          assert len(refs) == 1, refs
          print(refs[0])
          PYREF
            )
            playwright-cli click "$parity_ref"
            case "$kind" in
              video) playwright-cli upload docs/beta-samples/portrait-2s.mp4 ;;
              image) playwright-cli upload output/playwright/layer.png ;;
              audio) playwright-cli upload output/playwright/tone.wav ;;
            esac
            playwright-cli run-code --filename=scripts/veycut_web_parity_check.js > "output/playwright/parity-${kind}.log"
          done
          python3 scripts/verify_web_parity.py
          playwright-cli run-code --filename=scripts/veycut_web_legacy_check.js > output/playwright/legacy-open.log
          playwright-cli snapshot --filename=output/playwright/legacy-reconnect.yml
          legacy_ref=$(python3 - <<'PYREF'
          import re
          from pathlib import Path
          refs = re.findall(r'button "Reconnect selected media" \[ref=(e\d+)\]', Path('output/playwright/legacy-reconnect.yml').read_text())
          assert len(refs) == 1, refs
          print(refs[0])
          PYREF
          )
          playwright-cli click "$legacy_ref"
          playwright-cli upload docs/beta-samples/portrait-2s.mp4
          playwright-cli run-code --filename=scripts/veycut_web_legacy_check.js > output/playwright/legacy-check.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/playwright/legacy-report.json').read_text())
          assert report['status'] == 'passed' and len(report['checks']) == 4, report
          PY
          playwright-cli snapshot --filename=output/playwright/final.yml
          playwright-cli console > output/playwright/console.log
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VeyCut-web-checks
          path: output/playwright/
          if-no-files-found: warn
      - name: Retain tested static prototype
        uses: actions/upload-artifact@v7
        with:
          name: VeyCut-web-prototype
          path: web/
          if-no-files-found: error
