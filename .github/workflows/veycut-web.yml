name: VeyCut Web

on:
  push:
    branches: [main, development/0.3.0, development/web-editor-parity, development/web-parity-next, development/english-interface]
    paths: ['web/**', '!web/README.md', 'LICENSE', 'SOURCE-NOTICES.md', 'LICENSE-EXCEPTIONS.md', 'THIRD_PARTY_NOTICES.md', 'TRADEMARK.md', 'src/Cargo.toml', 'src/crates/concat-text/fonts/**', 'src/crates/veycut-web/**', 'src/crates/concat-project/**', 'src/crates/concat-core/**', 'src/Cargo.lock', '.github/workflows/veycut-web.yml', 'scripts/veycut_web_browser_check.js', 'scripts/test_web_compositor.js', 'scripts/veycut_web_parity_check.js', 'scripts/verify_web_parity.py', 'scripts/veycut_web_legacy_check.js', 'scripts/veycut_web_interop_check.js', 'scripts/veycut_web_transport_check.js', 'scripts/veycut_web_native_check.js', 'scripts/veycut_web_timelines_check.js', 'scripts/veycut_web_transition_check.js', 'scripts/veycut_web_shapes_check.js', 'scripts/veycut_web_speed_curve_check.js', 'scripts/test_webm_metadata.js', 'scripts/veycut_web_reliability_check.js', 'scripts/veycut_web_long_export_check.js', 'scripts/verify_web_long_export.py', 'scripts/veycut_web_mp4_check.js', 'scripts/veycut_web_real_export_check.js', 'scripts/verify_web_real_export.py', 'scripts/veycut_web_quality_check.js', 'scripts/test_project_bundle.js', 'scripts/veycut_web_bundle_check.js', 'scripts/test_blob_writer.js', 'scripts/veycut_web_offline_check.js', 'scripts/verify_web_offline.py', 'THIRD_PARTY_NOTICES.md']
  workflow_dispatch:
    inputs:
      long_export:
        description: Run the five-minute real browser recording and full decode
        type: boolean
        default: false
      real_export:
        description: Run real-footage MP4 export and full decoding
        type: boolean
        default: false
      frame_export:
        description: Render real footage using fixed frame timestamps and local AAC
        type: boolean
        default: false
      real_seconds:
        description: Real-footage output duration
        type: choice
        options: ['360', '600']
        default: '360'
  workflow_call:
    inputs:
      frame_export:
        type: boolean
        default: false
      real_seconds:
        type: string
        default: '360'
      real_export:
        type: boolean
        default: false
      long_export:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: veycut-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Shared engine and Chromium editing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: veycut-browser
          cache-on-failure: 'true'
          cache-workspace-crates: 'true'
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.127-linux-x64
      - name: Check portable bridge
        working-directory: src
        run: |
          cargo fmt -p veycut-web --check
          cargo clippy -p veycut-web --all-targets --locked -- -D warnings
          cargo test -p veycut-web --locked
          cargo clippy -p veycut-web --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build static browser package
        working-directory: src
        run: |
          cargo build -p veycut-web --release --target wasm32-unknown-unknown --locked
          if ! command -v wasm-bindgen > /dev/null; then
            cargo install wasm-bindgen-cli --version 0.2.127 --locked
          fi
          test "$(wasm-bindgen --version)" = 'wasm-bindgen 0.2.127'
          wasm-bindgen target/wasm32-unknown-unknown/release/veycut_web.wasm --target web --out-dir ../web/pkg
      - name: Bundle licensed Persian font
        run: |
          mkdir -p web/fonts
          cp src/crates/concat-text/fonts/Vazirmatn-Variable.ttf web/fonts/
          cp src/crates/concat-text/fonts/LICENSE-Vazirmatn.txt web/fonts/
          cp LICENSE SOURCE-NOTICES.md LICENSE-EXCEPTIONS.md THIRD_PARTY_NOTICES.md TRADEMARK.md web/
      - name: Bundle pinned frame-export codecs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 60 --max-filesize 10000000 https://registry.npmjs.org/mediabunny/-/mediabunny-1.61.4.tgz -o "$RUNNER_TEMP/mediabunny.tgz"
          python3 - <<'PYCODEC'
          import base64, hashlib, os
          with open(os.environ['RUNNER_TEMP']+'/mediabunny.tgz','rb') as source:
              digest=base64.b64encode(hashlib.file_digest(source,'sha512').digest()).decode()
          assert digest=='gZPBi40ldiZGeU2DJxT/Q3hlNiaxfpwNYTfmi0Maq3SoBJT64+W+ySc0Z7t+2JUGxNbkXnLFrDkSS2OQuweOhA==', 'Unexpected codec package'
          PYCODEC
          curl --fail --silent --show-error --retry 2 --max-time 60 --max-filesize 10000000 https://registry.npmjs.org/@mediabunny/aac-encoder/-/aac-encoder-1.61.4.tgz -o "$RUNNER_TEMP/aac-encoder.tgz"
          python3 - <<'PYAAC'
          import base64, hashlib, os
          with open(os.environ['RUNNER_TEMP']+'/aac-encoder.tgz','rb') as source:
              digest=base64.b64encode(hashlib.file_digest(source,'sha512').digest()).decode()
          assert digest=='BXqI+lQhpgPuiXMF4CIm/7isfkeUXjX2ysPtjN35dfI4L1RwW1//6VuJNsNMKw5vBPNjz31JeDd8ffFhJ2KipA==', 'Unexpected AAC encoder package'
          PYAAC
          mkdir -p web/vendor
          tar -xOf "$RUNNER_TEMP/mediabunny.tgz" package/dist/bundles/mediabunny.min.mjs > web/vendor/mediabunny.min.mjs
          tar -xOf "$RUNNER_TEMP/mediabunny.tgz" package/LICENSE > web/vendor/LICENSE-mediabunny.txt
          tar -xOf "$RUNNER_TEMP/aac-encoder.tgz" package/dist/bundles/mediabunny-aac-encoder.min.mjs > web/vendor/mediabunny-aac-encoder.min.mjs
          tar -xOf "$RUNNER_TEMP/aac-encoder.tgz" package/LICENSE > web/vendor/LICENSE-mediabunny-aac-encoder.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install server-only browser tools
        run: |
          npm install --global @playwright/cli@0.1.22
          node "$(npm root -g)/@playwright/cli/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install --yes ffmpeg
          node --check web/app.js
          node --check web/export.js
          node --check web/offline-export.js
          node scripts/test_blob_writer.js
          node --check scripts/veycut_web_offline_check.js
          node --check web/webm-metadata.js
          node --check web/output-check.js
          node --check web/audio-filters.js
          node --check web/compositor.js
          node --check web/preview.js
          node --check web/project-interop.js
          node scripts/test_project_bundle.js
          node --check scripts/veycut_web_bundle_check.js
          node scripts/veycut_web_interop_check.js
          node --check scripts/veycut_web_transport_check.js
          node --check scripts/veycut_web_native_check.js
          node --check scripts/veycut_web_timelines_check.js
          node --check scripts/veycut_web_transition_check.js
          node --check scripts/veycut_web_audio_tone_check.js
          node --check scripts/veycut_web_effects_check.js
          node --check scripts/veycut_web_speed_curve_check.js
          node --check scripts/veycut_web_shapes_check.js
          node scripts/test_web_compositor.js
          node scripts/test_webm_metadata.js
          node --check scripts/veycut_web_reliability_check.js
          node --check scripts/veycut_web_long_export_check.js
          node --check scripts/veycut_web_mp4_check.js
          node --check scripts/veycut_web_quality_check.js
          node --check scripts/veycut_web_real_export_check.js
          node --check scripts/veycut_web_browser_check.js
          node --check scripts/veycut_web_parity_check.js
          node --check scripts/veycut_web_legacy_check.js
      - name: Run browser editing workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/playwright
          python3 - <<'PY'
          from pathlib import Path
          folder = Path('output/playwright')
          (folder / 'captions.srt').write_text('1\n00:00:00,000 --> 00:00:00,800\nسلام جهان\n\n2\n00:00:00,800 --> 00:00:01,600\nEnglish caption\n')
          (folder / 'invalid.json').write_text('{"format":"unrelated"}')
          def stamp(ms):
              return f'00:00:{ms//1000:02d},{ms%1000:03d}'
          (folder / 'dense-captions.srt').write_text('\n\n'.join(f'{i+1}\n{stamp(i*100)} --> {stamp((i+1)*100)}\nکپشن {i+1}' for i in range(20)))
          PY
          python3 -m http.server 4173 --bind 127.0.0.1 --directory web > output/playwright/server.log 2>&1 &
          server_pid=$!
          cleanup_browser() {
            result=$?
            if [ "$result" -ne 0 ]; then
              for log in output/playwright/edit.log output/playwright/check.log output/playwright/limit-check.log output/playwright/parity*.log output/playwright/legacy*.log output/playwright/transport-check.log output/playwright/native-*.log output/playwright/transition-check.log output/playwright/timelines-check.log output/playwright/audio-tone-check.log output/playwright/speed-curve-check.log output/playwright/shapes-check.log output/playwright/reliability-check.log output/playwright/quality-check.log output/playwright/bundle-check.log output/playwright/offline-check.log; do
                if [ -f "$log" ]; then tail -c 18000 "$log"; fi
              done
              if [ -f output/playwright/parity-report.json ]; then
                python3 - <<'PYREPORT'
          import json
          from pathlib import Path
          report = json.loads(Path('output/playwright/parity-report.json').read_text())
          print(json.dumps({key: report.get(key) for key in ['status','phase','error','pageErrors','exportState','exportStatus']}))
          PYREPORT
              fi
              timeout 20s playwright-cli snapshot --filename=output/playwright/failure-snapshot.yml > output/playwright/failure-snapshot.log 2>&1 || true
              timeout 20s playwright-cli console > output/playwright/failure-console.log 2>&1 || true
            fi
            kill "$server_pid" || true
            playwright-cli close || true
            exit "$result"
          }
          trap cleanup_browser EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          playwright-cli open http://127.0.0.1:4173/ --browser=chromium > output/playwright/open.log
          playwright-cli snapshot --filename=output/playwright/initial.yml
          playwright-cli run-code --filename=scripts/veycut_web_browser_check.js > output/playwright/edit.log
          python3 - <<'PY'
          import copy, json
          from pathlib import Path
          folder = Path('output/playwright')
          project = json.loads((folder / 'project.json').read_text())
          native = project['engineDocument']
          legacy = {'format': 'veycut-web', 'schema': 1, 'engine': 'javascript',
              'media': [{key: value for key, value in item.items() if key != 'kind'} for item in project['media']],
              'clips': [{key: clip[key] for key in ['id', 'mediaId', 'in', 'out', 'timelineStart']} for clip in project['clips'] if clip['kind'] == 'video'],
              'cues': [{key: cue[key] for key in ['id', 'start', 'end', 'text']} for cue in project['cues']]}
          (folder / 'legacy-project.json').write_text(json.dumps(legacy))
          broken = copy.deepcopy(legacy)
          broken['clips'][0]['timelineStart'] = 'invalid'
          (folder / 'legacy-invalid.json').write_text(json.dumps(broken))
          ui_source = next(clip for clip in project['clips'] if clip['kind'] == 'video')
          native_source = next(clip for clip in native['clips'] if clip['id'] == ui_source['id'])
          duration = ui_source['out'] - ui_source['in']
          assert abs(duration - .8) < .002
          project['clips'], native['clips'] = [], []
          project['cues'], project['cueIds'] = [], []
          project['timelineCueIds'] = {timeline['id']: [] for timeline in native['timelines']}
          for index in range(501):
              identifier, position = 'browser-limit-' + str(index), .2 + index * 1.2
              ui_clip, native_clip = copy.deepcopy(ui_source), copy.deepcopy(native_source)
              ui_clip.update(id=identifier, timelineStart=position, start=position)
              native_clip.update(id=identifier, start=position)
              project['clips'].append(ui_clip)
              native['clips'].append(native_clip)
          active = [timeline for timeline in native['timelines'] if timeline['id'] == native['activeTimelineId']]
          assert len(active) == 1
          active[0]['clips'] = copy.deepcopy(native['clips'])
          assert abs(native['clips'][-1]['start'] + duration - 601) < .002
          (folder / 'limit-project.json').write_text(json.dumps(project))
          PY
          playwright-cli snapshot --filename=output/playwright/reconnect.yml
          reconnect_ref=$(python3 - <<'PY'
          import re
          from pathlib import Path
          snapshot = Path('output/playwright/reconnect.yml').read_text()
          refs = re.findall(r'button "Reconnect selected media" \[ref=(e\d+)\]', snapshot)
          assert len(refs) == 1, snapshot
          print(refs[0])
          PY
          )
          playwright-cli click "$reconnect_ref"
          playwright-cli upload docs/beta-samples/portrait-2s.mp4
          playwright-cli run-code --filename=scripts/veycut_web_browser_check.js > output/playwright/check.log
          playwright-cli snapshot --filename=output/playwright/limit-reconnect.yml
          limit_ref=$(python3 - <<'PY'
          import re
          from pathlib import Path
          refs = re.findall(r'button "Reconnect selected media" \[ref=(e\d+)\]', Path('output/playwright/limit-reconnect.yml').read_text())
          assert len(refs) == 1, refs
          print(refs[0])
          PY
          )
          playwright-cli click "$limit_ref"
          playwright-cli upload docs/beta-samples/portrait-2s.mp4
          playwright-cli run-code --filename=scripts/veycut_web_browser_check.js > output/playwright/limit-check.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          report = json.loads(Path('output/playwright/browser-report.json').read_text())
          assert report['status'] == 'passed' and report['engine'] == 'wasm'
          assert report['clips'] == 4 and report['videoClips'] == 2 and report['textClips'] == 2
          assert report['captions'] == 2 and report['language'] == 'en' and report['persianContentRTL'] is True
          assert len(report['checks']) == 16
          assert report['export']['precision'] == 'realtime'
          assert report['durationLimit'] == {'timelineSeconds': 601, 'limitSeconds': 600, 'downloaded': False}
          project = json.loads(Path('output/playwright/project.json').read_text())
          assert len(project['clips']) == 4
          assert project['engine'] == 'wasm'
          native = project['engineDocument']['clips']
          assert len(native) == 4
          videos = sorted([clip for clip in native if clip['kind'] == 'video'], key=lambda clip: clip['start'])
          titles = [clip for clip in native if clip['kind'] == 'text']
          assert len(videos) == len(titles) == 2
          assert abs(videos[0]['sourceStart'] - .2) < .002
          assert abs(videos[1]['sourceStart'] - 1) < .002
          assert all(abs(clip['duration'] - .8) < .002 for clip in videos)
          assert set(project['cueIds']) == {clip['id'] for clip in titles}
          for cue in project['cues']:
              title = next(clip for clip in titles if clip['id'] == cue['nativeId'])
              assert title['text']['content'] == cue['text']
              assert abs(title['start'] - cue['start']) < .002
              assert abs(title['duration'] - (cue['end'] - cue['start'])) < .002
          assert 'blob:' not in json.dumps(project)
          for name in ['cancel-after.json', 'export-after.json']:
              assert json.loads(Path('output/playwright', name).read_text()) == project, name + ' changed saved edits'
          assert 'Web check سلام' in Path('output/playwright/subtitles.srt').read_text()
          PY
          python3 - <<'PY'
          import array, json, math, subprocess
          from pathlib import Path
          folder = Path('output/playwright')
          output = folder / 'browser-video.webm'
          assert 0 < output.stat().st_size <= 256 * 1024 * 1024
          def run(arguments, **kwargs):
              return subprocess.run(arguments, check=True, timeout=90, stdout=subprocess.PIPE, stderr=subprocess.PIPE, **kwargs).stdout
          probe = json.loads(run(['ffprobe', '-v', 'error', '-show_streams', '-show_format', '-of', 'json', str(output)]))
          (folder / 'webm-probe.json').write_text(json.dumps(probe, indent=2))
          videos = [s for s in probe['streams'] if s['codec_type'] == 'video']
          audios = [s for s in probe['streams'] if s['codec_type'] == 'audio']
          assert len(videos) == len(audios) == 1, probe
          assert (videos[0]['width'], videos[0]['height']) == (360, 640)
          assert videos[0]['codec_name'] in ['vp8', 'vp9'] and audios[0]['codec_name'] == 'opus'
          assert 'webm' in probe['format']['format_name']
          run(['ffmpeg', '-v', 'error', '-xerror', '-i', str(output), '-map', '0:v:0', '-map', '0:a:0', '-f', 'null', '-'])
          frames = json.loads(run(['ffprobe', '-v', 'error', '-show_frames', '-show_entries', 'frame=media_type,best_effort_timestamp_time,pkt_duration_time', '-of', 'json', str(output)]))['frames']
          decoded = {}
          for kind, fallback in [('video', 1 / 30), ('audio', 960 / 48000)]:
              selected = [f for f in frames if f['media_type'] == kind]
              assert selected and all('best_effort_timestamp_time' in f for f in selected)
              pts = [float(f['best_effort_timestamp_time']) for f in selected]
              assert pts == sorted(pts), kind + ' timestamps out of order'
              end = max(float(f['best_effort_timestamp_time']) + float(f.get('pkt_duration_time', fallback)) for f in selected)
              assert 1.45 <= end <= 2.15, (kind, end)
              decoded[kind] = {'frames': len(selected), 'ptsEndSeconds': end, 'lastFramePtsSeconds': max(pts)}
          assert decoded['video']['frames'] >= 30
          pcm = array.array('h')
          pcm.frombytes(run(['ffmpeg', '-v', 'error', '-i', str(output), '-vn', '-ac', '1', '-ar', '8000', '-f', 's16le', '-']))
          assert len(pcm) >= 10000
          rms = math.sqrt(sum((sample / 32768) ** 2 for sample in pcm) / len(pcm))
          assert rms > .001, 'Source tone missing from decoded audio'
          def window_rms(start, end):
              samples = pcm[round(start * 8000):round(end * 8000)]
              assert len(samples) >= 1600, ('Decoded audio too short for timing window', start, end)
              return math.sqrt(sum((sample / 32768) ** 2 for sample in samples) / len(samples))
          # The fixture is silent before source1s, then contains a tone.
          # Leading0.2s plus source0.2-1.0 keeps the intended global onset1.0s.
          silence_rms, tone_rms = window_rms(.25, .65), window_rms(1.2, 1.5)
          assert silence_rms < .001, ('Tone arrived early', silence_rms)
          assert tone_rms > .001 and tone_rms > silence_rms * 5, ('Tone absent after intended onset', tone_rms, silence_rms)
          def caption_frame(at, name):
              run(['ffmpeg', '-v', 'error', '-ss', str(at), '-i', str(output), '-frames:v', '1', '-y', str(folder / name)])
              rgb = run(['ffmpeg', '-v', 'error', '-i', str(folder / name), '-frames:v', '1', '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-'])
              assert len(rgb) == 360 * 640 * 3
              return sum(min(rgb[(y * 360 + x) * 3:(y * 360 + x) * 3 + 3]) >= 180
                         for y in range(int(640 * .82), int(640 * .94)) for x in range(18, 342))
          caption_pixels = caption_frame(.4, 'export-caption-frame.png')
          blank_at = max(.8, decoded['video']['lastFramePtsSeconds'] - .003)
          blank_pixels = caption_frame(blank_at, 'export-caption-ended-frame.png')
          assert caption_pixels > 100 and blank_pixels < max(40, caption_pixels * .05), (caption_pixels, blank_pixels)
          evidence = {'status': 'passed', 'fullDecode': True, 'dimensions': [360, 640],
              'expectedTimelineSeconds': 1.8, 'allowedPtsEndSeconds': [1.45, 2.15],
              'decoded': decoded, 'audioRms': rms,
              'audioTiming': {'expectedToneOnsetSeconds': 1.0,
                  'silenceWindowSeconds': [.25, .65], 'silenceRms': silence_rms,
                  'toneWindowSeconds': [1.2, 1.5], 'toneRms': tone_rms,
                  'precision': 'Bounded separated windows, not sample-accurate synchronization.'},
              'captionRegionBrightPixels': caption_pixels,
              'endedCaptionRegionBrightPixels': blank_pixels, 'endedCaptionFrameSeconds': blank_at,
              'limits': 'Duration rejection and offered dimensions tested; size cap enforced on output, not stress-tested.',
              'precision': 'Real-time browser output; this synthetic short fixture does not prove frame-accurate timing or real user footage.'}
          (folder / 'webm-decoder-report.json').write_text(json.dumps(evidence, indent=2))
          PY
          ffmpeg -v error -f lavfi -i color=c=red:s=256x256 -frames:v 1 -threads 1 -y output/playwright/layer.png
          ffmpeg -v error -f lavfi -i color=c=blue:s=256x256 -frames:v 1 -threads 1 -y output/playwright/blue.png
          ffmpeg -v error -f lavfi -i sine=frequency=880:duration=2:sample_rate=48000 -c:a pcm_s16le -y output/playwright/tone.wav
          playwright-cli run-code --filename=scripts/veycut_web_parity_check.js > output/playwright/parity-check.log
          for kind in video image audio; do
            playwright-cli run-code 'async page => { await page.locator("#reselect").click(); }'
            case "$kind" in
              video) playwright-cli upload docs/beta-samples/portrait-2s.mp4 ;;
              image) playwright-cli upload output/playwright/layer.png ;;
              audio) playwright-cli upload output/playwright/tone.wav ;;
            esac
            playwright-cli run-code --filename=scripts/veycut_web_parity_check.js > "output/playwright/parity-${kind}.log"
          done
          python3 scripts/verify_web_parity.py
          playwright-cli run-code --filename=scripts/veycut_web_legacy_check.js > output/playwright/legacy-open.log
          playwright-cli run-code 'async page => { await page.locator("#reselect").click(); }'
          playwright-cli upload docs/beta-samples/portrait-2s.mp4
          playwright-cli run-code --filename=scripts/veycut_web_legacy_check.js > output/playwright/legacy-check.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/playwright/legacy-report.json').read_text())
          assert report['status'] == 'passed' and len(report['checks']) == 4, report
          PY
          playwright-cli run-code --filename=scripts/veycut_web_transition_check.js > output/playwright/transition-check.log
          ffmpeg -v error -i output/playwright/transition-video.webm -f null -
          python3 - <<'PYTRANSITION'
          import json, subprocess
          from pathlib import Path
          root = Path('output/playwright')
          samples = []
          for at in [.2, .75, 1.5]:
              pixel = subprocess.check_output(['ffmpeg', '-v', 'error', '-ss', str(at), '-i', str(root / 'transition-video.webm'), '-frames:v', '1', '-vf', 'crop=2:2:180:320', '-pix_fmt', 'rgb24', '-f', 'rawvideo', '-'])
              assert len(pixel) == 12
              samples.append(list(pixel[:3]))
          red, mixed, blue = samples
          assert red[0] > 200 and red[2] < 40, samples
          assert mixed[0] > 45 and mixed[2] > 45, samples
          assert blue[2] > 200 and blue[0] < 40, samples
          (root / 'transition-decoder-report.json').write_text(json.dumps({'status':'passed', 'centerPixelsAtSeconds':[.2,.75,1.5], 'pixels':samples, 'precision':'Short real-time image dissolve, not long-footage frame-accuracy proof.'}, indent=2))
          PYTRANSITION
          playwright-cli run-code --filename=scripts/veycut_web_timelines_check.js > output/playwright/timelines-check.log
          playwright-cli run-code --filename=scripts/veycut_web_transport_check.js > output/playwright/transport-check.log
          playwright-cli run-code --filename=scripts/veycut_web_native_check.js > output/playwright/native-open.log
          playwright-cli snapshot --filename=output/playwright/native-reconnect.yml
          playwright-cli run-code 'async page => { await page.locator("#reselect").click(); }'
          playwright-cli upload docs/beta-samples/portrait-2s.mp4
          playwright-cli run-code --filename=scripts/veycut_web_native_check.js > output/playwright/native-reconnect.log
          playwright-cli snapshot --filename=output/playwright/native-browser-import.yml
          playwright-cli run-code 'async page => { await page.locator("#import").click(); }'
          playwright-cli upload docs/beta-samples/portrait-2s.mp4
          playwright-cli run-code --filename=scripts/veycut_web_native_check.js > output/playwright/native-check.log
          python3 - <<'PYINTEROP'
          import json
          from pathlib import Path
          root = Path('output/playwright')
          report = json.loads((root / 'native-report.json').read_text())
          assert report['status'] == 'passed' and report['bulkCueCount'] == 55, report
          native = json.loads((root / 'native-roundtrip.json').read_text())
          assert native['futureProjectField']['preserve'] is True
          assert native['media'][0]['path'] == '/desktop/original/portrait-2s.mp4'
          assert native['media'][0]['futureMediaField']['preserve'] == 'metadata'
          assert native['clips'][0]['futureClipField']['preserve'] == ['one', 2]
          bulk = json.loads((root / 'native-bulk-captions.json').read_text())
          captions = [clip for clip in bulk['clips'] if clip['kind'] == 'text']
          assert len(captions) == 55 and len(set(clip['trackId'] for clip in captions)) == 1
          assert captions[1]['text']['content'] == 'سلام 1'
          PYINTEROP
          ffmpeg -v error -f lavfi -i sine=frequency=110:duration=2:sample_rate=48000 -c:a pcm_s16le -y output/playwright/tone-bass.wav
          python3 - <<'PYECHO'
          import math, struct, wave
          with wave.open('output/playwright/echo-pulse.wav','wb') as out:
              out.setnchannels(1);out.setsampwidth(2);out.setframerate(48000)
              out.writeframes(b''.join(struct.pack('<h',int(22000*math.sin(2*math.pi*800*i/48000))) if 4800<=i<6720 or 43200<=i<45120 else b'\0\0' for i in range(96000)))
          PYECHO
          playwright-cli run-code --filename=scripts/veycut_web_audio_tone_check.js > output/playwright/audio-tone-check.log
          python3 scripts/verify_web_audio_tone.py
          ffmpeg -v error -f lavfi -i testsrc2=s=256x256 -frames:v 1 -threads 1 -y output/playwright/effects-source.png
          ffmpeg -v error -f lavfi -i color=c=0x00b140:s=256x256 -frames:v 1 -threads 1 -y output/playwright/screen.png
          playwright-cli run-code --filename=scripts/veycut_web_effects_check.js > output/playwright/effects-check.log
          ffmpeg -v error -xerror -i output/playwright/effects-video.webm -f null -
          ffmpeg -v error -xerror -i output/playwright/chroma-video.webm -f null -
          ffmpeg -v error -xerror -i output/playwright/blur-filtered.webm -f null -
          python3 scripts/verify_web_effects.py
          playwright-cli run-code --filename=scripts/veycut_web_speed_curve_check.js > output/playwright/speed-curve-check.log
          ffmpeg -v error -xerror -i output/playwright/speed-curve.webm -f null -
          python3 - <<'PYSPEED'
          import json, subprocess
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json','output/playwright/speed-curve.webm']))
          frames=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_frames','-show_entries','frame=media_type,best_effort_timestamp_time','-of','json','output/playwright/speed-curve.webm']))['frames']
          video_times=[float(frame['best_effort_timestamp_time']) for frame in frames if frame['media_type']=='video' and 'best_effort_timestamp_time' in frame]
          assert len(video_times)>20 and 1.7 < video_times[-1] < 2.5, f'Curved export video frames: {video_times[-1:]}'
          assert any(s['codec_type']=='video' for s in meta['streams'])
          assert any(s['codec_type']=='audio' for s in meta['streams'])
          PYSPEED
          playwright-cli run-code --filename=scripts/veycut_web_shapes_check.js > output/playwright/shapes-check.log
          ffmpeg -v error -xerror -i output/playwright/shapes-video.webm -f null -
          python3 - <<'PYSHAPES'
          import subprocess
          frame=subprocess.check_output(['ffmpeg','-v','error','-ss','0.8','-i','output/playwright/shapes-video.webm','-frames:v','1','-f','rawvideo','-pix_fmt','rgb24','-'])
          assert len(frame)==360*640*3
          def pixel(x,y):
              at=(y*360+x)*3
              return frame[at:at+3]
          centre=pixel(180,320)
          assert centre[0]>210 and centre[1]<35 and centre[2]<35, list(centre)
          assert max(pixel(10,10))<20 and max(pixel(40,320))<20
          PYSHAPES
          playwright-cli run-code --filename=scripts/veycut_web_reliability_check.js > output/playwright/reliability-check.log
          playwright-cli run-code --filename=scripts/veycut_web_quality_check.js > output/playwright/quality-check.log
          for quality in compact balanced detailed; do ffmpeg -v error -xerror -i "output/playwright/quality-${quality}.mp4" -f null -; done
          ffmpeg -v error -xerror -i output/playwright/reliable-video.webm -f null -
          ffmpeg -v error -xerror -i output/playwright/minimum-video.webm -f null -
          ffmpeg -v error -xerror -i output/playwright/fallback-video.webm -f null -
          ffmpeg -v error -xerror -i output/playwright/dense-video.webm -f null -
          python3 - <<'PYRELIABLE'
          import json, subprocess
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json','output/playwright/reliable-video.webm']))
          assert abs(float(meta['format']['duration'])-2)<.5
          report=json.load(open('output/playwright/reliability-report.json'))
          assert report['status']=='passed' and len(report['failures'])==4
          PYRELIABLE
          playwright-cli run-code --filename=scripts/veycut_web_bundle_check.js > output/playwright/bundle-check.log
          ffmpeg -v error -xerror -i output/playwright/bundle-video.mp4 -f null -
          playwright-cli run-code --filename=scripts/veycut_web_offline_check.js > output/playwright/offline-check.log
          python3 scripts/verify_web_offline.py
          curl --fail --location --retry 2 --max-time 60 --max-filesize 20000000 https://media.w3.org/2010/05/sintel/trailer.mp4 -o output/playwright/mp4-input.mp4
          playwright-cli run-code --filename=scripts/veycut_web_mp4_input_check.js > output/playwright/mp4-input-check.log
          python3 scripts/verify_web_mp4_input.py
          rm output/playwright/mp4-input.mp4
          playwright-cli snapshot --filename=output/playwright/final.yml
          playwright-cli console > output/playwright/console.log
      - name: Five-minute source and real browser export
        if: inputs.long_export == true
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -v error -f lavfi -i "color=red:s=160x90:r=10:d=60[r];color=green:s=160x90:r=10:d=60[g];color=blue:s=160x90:r=10:d=60[b];color=yellow:s=160x90:r=10:d=60[y];color=magenta:s=160x90:r=10:d=60[m];[r][g][b][y][m]concat=n=5:v=1:a=0" -f lavfi -i "sine=frequency=660:sample_rate=48000:duration=300" -af "volume='if(lt(mod(t,60),2)+gte(t,298),1,0)':eval=frame" -t 300 -c:v libx264 -preset ultrafast -crf 30 -c:a aac -b:a 64k -y output/playwright/long-source.mp4
          python3 - <<'PYCAPTION'
          from pathlib import Path
          Path('output/playwright/long-captions.srt').write_text('1\n00:04:55,000 --> 00:04:59,000\nسلام؛ پایان ویدئو\n')
          PYCAPTION
          python3 -m http.server 4173 --bind 127.0.0.1 --directory web > output/playwright/long-server.log 2>&1 &
          server_pid=$!
          cleanup_long() {
            result=$?
            if [ "$result" -ne 0 ]; then
              tail -c 18000 output/playwright/long-check.log || true
              playwright-cli snapshot --filename=output/playwright/long-failure.yml || true
            fi
            kill "$server_pid" || true
            playwright-cli close || true
            exit "$result"
          }
          trap cleanup_long EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          playwright-cli open http://127.0.0.1:4173/ --browser=chromium > output/playwright/long-open.log
          playwright-cli snapshot --filename=output/playwright/long-initial.yml
          playwright-cli run-code --filename=scripts/veycut_web_long_export_check.js > output/playwright/long-setup.log
          playwright-cli snapshot --filename=output/playwright/long-reconnect.yml
          reconnect_ref=$(python3 - <<'PYREF'
          import re
          from pathlib import Path
          refs=re.findall(r'button "Reconnect selected media" \[ref=(\w+)\]',Path('output/playwright/long-reconnect.yml').read_text())
          assert len(refs)==1,refs
          print(refs[0])
          PYREF
          )
          playwright-cli click "$reconnect_ref"
          playwright-cli upload output/playwright/long-source.mp4
          timeout 420s playwright-cli run-code --filename=scripts/veycut_web_long_export_check.js > output/playwright/long-check.log
          python3 scripts/verify_web_long_export.py
      - name: Real-footage MP4 export
        if: inputs.real_export == true
        env:
          REAL_EXPORT_SECONDS: ${{ inputs.real_seconds || '360' }}
          FRAME_EXPORT: ${{ inputs.frame_export || false }}
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 --max-filesize 700000000 https://media.xiph.org/tearsofsteel/tears_of_steel_1080p.webm -o output/playwright/real-source.webm
          python3 - <<'PYCAPTION'
          import json, os
          from pathlib import Path
          seconds=int(os.environ['REAL_EXPORT_SECONDS']);assert seconds in [360,600]
          Path('web/real-export-config.json').write_text(json.dumps({'seconds':seconds,'mode':'frames' if os.environ['FRAME_EXPORT']=='true' else 'realtime'}))
          def stamp(at): return f'00:{at//60:02d}:{at%60:02d},000'
          Path('output/playwright/real-captions.srt').write_text(f'1\n{stamp(seconds-10)} --> {stamp(seconds-2)}\nسلام؛ پایان فیلم واقعی\n')
          PYCAPTION
          if [ "$FRAME_EXPORT" = 'true' ]; then
            mv output/playwright/real-source.webm output/playwright/real-original.webm
            # Preserve the real picture stream; convert Vorbis to a WebCodecs-decodable audio track.
            ffmpeg -v error -i output/playwright/real-original.webm -map 0:v:0 -map 0:a:0 -c:v copy -c:a libopus -b:a 128k -avoid_negative_ts make_zero -y output/playwright/real-source.webm
            rm -f output/playwright/real-original.webm
          fi
          python3 -m http.server 4173 --bind 127.0.0.1 --directory web > output/playwright/real-server.log 2>&1 &
          server_pid=$!
          cleanup_real() {
            result=$?
            if [ "$result" -ne 0 ]; then
              for log in output/playwright/mp4-check.log output/playwright/real-setup.log output/playwright/real-check.log; do tail -c 12000 "$log" || true; done
              playwright-cli snapshot --filename=output/playwright/real-failure.yml || true
            fi
            rm -f output/playwright/real-source.webm web/real-export-config.json
            kill "$server_pid" || true
            playwright-cli close || true
            exit "$result"
          }
          trap cleanup_real EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          playwright-cli open http://127.0.0.1:4173/ --browser=chromium > output/playwright/real-open.log
          playwright-cli run-code --filename=scripts/veycut_web_mp4_check.js > output/playwright/mp4-check.log
          playwright-cli run-code --filename=scripts/veycut_web_real_export_check.js > output/playwright/real-setup.log
          playwright-cli snapshot --filename=output/playwright/real-reconnect.yml
          reconnect_ref=$(python3 - <<'PYREF'
          import re
          from pathlib import Path
          refs=re.findall(r'button "Reconnect selected media" \[ref=(\w+)\]',Path('output/playwright/real-reconnect.yml').read_text())
          assert len(refs)==1,refs
          print(refs[0])
          PYREF
          )
          playwright-cli click "$reconnect_ref"
          playwright-cli upload output/playwright/real-source.webm
          timeout 780s playwright-cli run-code --filename=scripts/veycut_web_real_export_check.js > output/playwright/real-check.log
          python3 scripts/verify_web_real_export.py
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VeyCut-web-checks
          path: output/playwright/
          if-no-files-found: warn
      - name: Retain tested static prototype
        uses: actions/upload-artifact@v7
        with:
          name: VeyCut-web-prototype
          path: web/
          if-no-files-found: error
