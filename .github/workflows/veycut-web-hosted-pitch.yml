name: Verify public media output
on:
  push:
    branches: [validation/web-pitch-hosted]
    paths: ['.github/workflows/veycut-web-hosted-pitch.yml', 'scripts/veycut_web_pitch_export_check.js', 'scripts/verify_web_pitch_export.py', 'scripts/veycut_web_footage_check.js', 'scripts/verify_web_footage.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Require public main identity and exercise pitch output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_commit=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          for attempt in {1..20}; do
            curl --fail --silent --show-error --max-time 30 "https://alirezap73.github.io/veycut/build-info.json?probe=$main_commit" -o "$RUNNER_TEMP/public-build.json"
            actual=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/public-build.json'))['sourceCommit'])")
            if [ "$actual" = "$main_commit" ]; then break; fi
            sleep 15
          done
          [ "$actual" = "$main_commit" ]
          npm install --global @playwright/cli@0.1.22
          node "$(npm root -g)/@playwright/cli/node_modules/playwright/cli.js" install --with-deps chromium
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p output/playwright
          ffmpeg -v error -f lavfi -i "sine=frequency=880:sample_rate=48000:duration=8" -f lavfi -i "sine=frequency=660:sample_rate=48000:duration=8" -filter_complex "[0:a][1:a]amerge=inputs=2[a]" -map "[a]" -c:a pcm_s16le -y output/playwright/pitch-tone.wav
          ffmpeg -v error -f lavfi -i color=c=red:s=256x256 -frames:v 1 -threads 1 -y output/playwright/layer.png
          playwright-cli open https://alirezap73.github.io/veycut/ --browser=chromium
          playwright-cli run-code --filename=scripts/veycut_web_pitch_export_check.js
          python3 scripts/verify_web_pitch_export.py
          python3 - <<'PYHOST'
          import json,os
          from pathlib import Path
          expected=json.loads((Path(os.environ['RUNNER_TEMP'])/'public-build.json').read_text())
          report=json.load(open('output/playwright/pitch-export-report.json'))
          assert report['publicPage'] and report['build']==expected
          assert report['build']['version']=='0.3.1'
          PYHOST
          curl --fail --location --retry 2 --max-time 60 --max-filesize 2000000 https://raw.githubusercontent.com/mdn/interactive-examples/main/live-examples/media/cc0-videos/flower.mp4 -o output/playwright/footage.mp4
          python3 - <<'PYFIX'
          import hashlib
          from pathlib import Path
          data=Path('output/playwright/footage.mp4').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='bd91051dc5b10dc351ea06e5430dd335fb1ffb14'
          PYFIX
          playwright-cli run-code --filename=scripts/veycut_web_footage_check.js
          python3 scripts/verify_web_footage.py
          python3 - <<'PYBUILD'
          import json,os
          from pathlib import Path
          expected=json.loads((Path(os.environ['RUNNER_TEMP'])/'public-build.json').read_text())
          assert json.load(open('output/playwright/footage-report.json'))['build']==expected
          PYBUILD
          playwright-cli close
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Public-pitch-checks
          path: output/playwright/
