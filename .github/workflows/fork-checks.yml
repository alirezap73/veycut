name: Fork development checks

# Manual checks for the fork before a full desktop build. These jobs do
# not render media, build the GUI, or publish a release.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fork-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
      - name: Project source formatting
        run: cargo fmt -p concat-project -p concat-host --check
        working-directory: src
      - name: Translation inventory
        run: python3 scripts/locales.py --check
      - name: Optional model trial input and credential policy
        run: python3 scripts/test_model_trial.py
      - name: Core and project tests
        run: cargo test --locked -j 1 -p concat-core -p concat-project -- --test-threads=1
        working-directory: src
      - name: Subtitle file tests without media services
        run: |
          rustc --edition 2024 -D warnings --test crates/concat-host/src/subtitle_files.rs -o "$RUNNER_TEMP/subtitle-file-tests"
          "$RUNNER_TEMP/subtitle-file-tests" --test-threads=1
        working-directory: src
      - name: Export path tests without media services
        run: |
          rustc --edition 2024 -D warnings --test crates/concat-host/src/export_paths.rs -o "$RUNNER_TEMP/export-path-tests"
          "$RUNNER_TEMP/export-path-tests" --test-threads=1
        working-directory: src
      - name: Bounded missing media search tests
        run: |
          rustc --edition 2024 -D warnings --test crates/concat-host/src/relink_files.rs -o "$RUNNER_TEMP/relink-file-tests"
          "$RUNNER_TEMP/relink-file-tests" --test-threads=1
        working-directory: src
      - name: Isolated export files and no-replace publication
        run: python3 scripts/test_export_files.py
      - name: VeyCut release metadata tests
        run: python3 scripts/test_veycut_release.py
      - name: Mac preview validation policy tests
        run: python3 scripts/test_verify_preview_ci.py
