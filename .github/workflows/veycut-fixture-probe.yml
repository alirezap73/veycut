name: Probe original camera and narrated speech fixtures
on:
  workflow_dispatch:
    inputs:
      validated_run:
        description: Optional successful runtime-identical candidate Web build; empty uses public site on manual runs.
        required: false
        type: string
      diagnostic_run:
        description: 'Optional previous fixture run ID; reuse its outputs for diagnosis only, without repeating browser edits.'
        required: false
        type: string
  push:
    branches: [validation/web-original-camera, development/web-ramp-parity]
    paths:
      - scripts/veycut_fixture*
      - docs/evidence/fixture-sources.json
      - .github/workflows/veycut-fixture-probe.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: fixture-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install server-only probing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verify unchanged owner originals and measure timing
        run: python3 scripts/veycut_fixture_probe.py
      - name: Reuse previous short outputs for diagnosis on server
        if: inputs.diagnostic_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN: ${{ inputs.diagnostic_run }}
        run: |
          [[ "$DIAGNOSTIC_RUN" =~ ^[0-9]+$ ]]
          gh run view "$DIAGNOSTIC_RUN" --repo "$GITHUB_REPOSITORY" --json workflowName --jq '.workflowName' > /tmp/fixture-workflow-name
          test "$(cat /tmp/fixture-workflow-name)" = "Probe original camera and narrated speech fixtures"
          gh run download "$DIAGNOSTIC_RUN" --repo "$GITHUB_REPOSITORY" --name original-camera-fixture-probe --dir /tmp/previous-fixture-output
          cp /tmp/previous-fixture-output/fixture-ui.json output/fixtures/
          cp /tmp/previous-fixture-output/*-output.mp4 output/fixtures/
          python3 scripts/veycut_fixture_verify.py --diagnostic-reuse
      - name: Install server browser
        if: inputs.diagnostic_run == ''
        run: |
          npm install --global @playwright/cli@0.1.22
          node "$(npm root -g)/@playwright/cli/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Require tested candidate browser package
        if: inputs.diagnostic_run == '' && (inputs.validated_run != '' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.validated_run || '38405434013' }}
        run: |
          set -euo pipefail
          for attempt in {1..80}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/web-run.json"
            state=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/web-run.json'))['status'])")
            if [ "$state" = completed ]; then break; fi
            sleep 15
          done
          source_commit=$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          run=json.loads((Path(os.environ['RUNNER_TEMP'])/'web-run.json').read_text())
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['repository']['full_name']==os.environ['GITHUB_REPOSITORY'] and run['path']=='.github/workflows/veycut-web.yml'
          print(run['head_sha'])
          PY
          )
          git fetch origin "$source_commit"
          git diff --exit-code "$source_commit" HEAD -- web src/crates/veycut-web src/crates/concat-project src/crates/concat-core
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name VeyCut-web-prototype --dir candidate-web
          echo "FIXTURE_URL=http://127.0.0.1:4173/" >> "$GITHUB_ENV"
      - name: Test original camera edits through the public application
        if: inputs.diagnostic_run == ''
        run: |
          if [ -d candidate-web ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 --directory candidate-web > output/fixtures/server.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" || true; playwright-cli close || true' EXIT
            for attempt in {1..20}; do
              if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
              sleep 1
            done
          fi
          playwright-cli open "${FIXTURE_URL:-https://alirezap73.github.io/veycut/}" --browser=chromium
          playwright-cli run-code --filename=scripts/veycut_fixture_ui_check.js
          python3 scripts/veycut_fixture_verify.py
          playwright-cli close
      - name: Publish bounded probe summary
        if: always()
        run: |
          if test -f output/fixtures/probe-report.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('output/fixtures/probe-report.json'))
          print('Original source integrity and timing probe; application/native parity remains a separate test.')
          for f in r['fixtures']:
            print(f"- {f['id']}: {f['integrity']['bytes']} bytes; measured variable timing: {f['packetTiming']['measuredVariableTiming']}; exact SHA-256 checked.")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-camera-fixture-probe
          retention-days: 3
          path: |
            output/fixtures/probe-report.json
            output/fixtures/SOURCE-README.md
            output/fixtures/SOURCE-metadata.csv
            output/fixtures/*.vtt
            output/fixtures/*-speech-derived.wav
            output/fixtures/fixture-ui.json
            output/fixtures/fixture-output-report.json
            output/fixtures/*-output.mp4
          if-no-files-found: warn
