name: Publish tested VeyCut Web

on:
  workflow_dispatch:
    inputs:
      validated_run_id:
        description: Optional successful VeyCut Web main run for this exact commit
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.validated_run_id == ''
    uses: ./.github/workflows/veycut-web.yml
  reuse:
    name: Verify an existing main build
    if: github.ref == 'refs/heads/main' && inputs.validated_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require a successful exact-commit Web run
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
        run: |
          [[ "$VALIDATED_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN_ID" > validated-run.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('validated-run.json'))
          assert run['status']=='completed' and run['conclusion']=='success', 'Build is not successful'
          assert run['head_sha']==os.environ['GITHUB_SHA'], 'Build source differs from this publication'
          assert run['head_branch']=='main' and run['event'] in ['push','workflow_dispatch'], 'Build is not a main publication candidate'
          assert run['path']=='.github/workflows/veycut-web.yml', 'Unexpected validation workflow'
          assert run['repository']['full_name']==os.environ['GITHUB_REPOSITORY'], 'Unexpected repository'
          print('Verified main build',run['id'],run['head_sha'])
          PY
  deploy:
    name: Publish verified browser package
    needs: [validate, reuse]
    if: always() && github.ref == 'refs/heads/main' && ((needs.validate.result == 'success' && needs.reuse.result == 'skipped') || (needs.reuse.result == 'success' && needs.validate.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: veycut-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: VeyCut-web-prototype
          path: site
          run-id: ${{ inputs.validated_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: VeyCut-web-checks
          path: verified-checks
          run-id: ${{ inputs.validated_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Retain public browser verification
        run: |
          mkdir -p site/screenshots
          cp verified-checks/parity-desktop.png site/screenshots/editor.png
          cp verified-checks/parity-english-mobile-persian-content.png site/screenshots/editor-mobile.png
          cp verified-checks/parity-report.json verified-checks/parity-decoder-report.json site/
          cp verified-checks/native-report.json verified-checks/timelines-report.json verified-checks/transition-decoder-report.json site/
          cp verified-checks/native-interchange.png site/screenshots/native-interchange.png
          cp verified-checks/timelines-editor.png site/screenshots/timelines.png
          if [ -f verified-checks/reliability-report.json ]; then cp verified-checks/reliability-report.json site/; fi
          if [ -f verified-checks/long-decoder-report.json ]; then cp verified-checks/long-decoder-report.json site/; fi
      - name: Package downloadable web edition
        env:
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          root = Path('site')
          (root / 'build-info.json').write_text(json.dumps({'version': '0.3.1', 'channel': 'web-preview', 'sourceCommit': os.environ['VERIFIED_COMMIT'], 'validatedOn': 'GitHub Actions'}, indent=2))
          files = sorted(p for p in root.rglob('*') if p.is_file())
          folder = root / 'downloads'
          folder.mkdir()
          with zipfile.ZipFile(folder / 'VeyCut-web.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.relative_to(root))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/veycut_web_hosted_check.js
            docs/beta-samples/portrait-2s.mp4
          sparse-checkout-cone-mode: false
      - name: Verify public editor on server
        env:
          PUBLIC_WEB_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm install --global @playwright/cli@0.1.22
          node "$(npm root -g)/@playwright/cli/node_modules/playwright/cli.js" install --with-deps chromium
          web_url="${PUBLIC_WEB_URL%/}/"
          curl --fail --silent --show-error --max-time 30 "${web_url}build-info.json"
          curl --fail --silent --show-error --head --max-time 30 "${web_url}downloads/VeyCut-web.zip"
          playwright-cli open "$PUBLIC_WEB_URL" --browser=chromium
          playwright-cli run-code --filename=scripts/veycut_web_hosted_check.js
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -v error -xerror -i hosted-frame.mp4 -f null -
          python3 - <<'PYHOST'
          import json, os, subprocess
          report=json.load(open('hosted-frame-report.json'))
          assert report['build']['sourceCommit']==os.environ['GITHUB_SHA'] and report['build']['version']=='0.3.1'
          assert report['precision']=='fixed-frame-timestamps' and report['encoding']['audioCodec']=='aac'
          streams=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json','hosted-frame.mp4']))['streams']
          assert {s['codec_type']:s['codec_name'] for s in streams}=={'video':'h264','audio':'aac'}
          print(json.dumps(report))
          PYHOST
          playwright-cli close
