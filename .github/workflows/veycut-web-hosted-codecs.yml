name: Verify public codec selections
on:
  push:
    branches: [development/web-pitch-parity]
    paths: ['.github/workflows/veycut-web-hosted-codecs.yml', 'scripts/veycut_web_codec_check.js', 'scripts/verify_web_codecs.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Require public main identity and exercise codecs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_commit=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          for attempt in {1..20}; do
            curl --fail --silent --show-error --max-time 30 "https://alirezap73.github.io/veycut/build-info.json?probe=$main_commit" -o "$RUNNER_TEMP/public-build.json"
            actual=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/public-build.json'))['sourceCommit'])")
            if [ "$actual" = "$main_commit" ]; then break; fi
            sleep 15
          done
          [ "$actual" = "$main_commit" ]
          npm install --global @playwright/cli@0.1.22
          node "$(npm root -g)/@playwright/cli/node_modules/playwright/cli.js" install --with-deps chromium
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p output/playwright
          playwright-cli open https://alirezap73.github.io/veycut/ --browser=chromium
          playwright-cli run-code --filename=scripts/veycut_web_codec_check.js
          python3 scripts/verify_web_codecs.py
          python3 - <<'PYHOST'
          import json,os
          from pathlib import Path
          expected=json.loads((Path(os.environ['RUNNER_TEMP'])/'public-build.json').read_text())
          report=json.load(open('output/playwright/codec-report.json'))
          assert report['publicPage'] and report['build']==expected
          assert report['build']['version']=='0.3.1'
          PYHOST
          playwright-cli close
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Public-codec-checks
          path: output/playwright/
