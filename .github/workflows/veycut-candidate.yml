name: VeyCut macOS candidate

# Builds a test artifact after native validation. It creates no release.
on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: CI run with passing Linux, macOS and wasm checks for this runtime source
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: veycut-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'alirezap73/veycut'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify native Mac preview checks and runtime identity
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN" > "$RUNNER_TEMP/validation.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 scripts/test_verify_preview_ci.py
          python3 scripts/verify_preview_ci.py "$RUNNER_TEMP/validation.json" "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/VALIDATION.json"
      - uses: actions/upload-artifact@v7
        with:
          name: VeyCut-platform-validation
          path: ${{ runner.temp }}/VALIDATION.json
          if-no-files-found: error
  quick:
    uses: ./.github/workflows/fork-checks.yml
  build:
    needs: [validate, quick]
    uses: ./.github/workflows/build-app.yml
    with:
      target_matrix: '{"include":[{"platform":"macos","arch":"arm64","os":"macos-15","target":"aarch64-apple-darwin","sherpa":"osx-arm64"}]}'
